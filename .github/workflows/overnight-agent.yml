name: Overnight Agent

# Runs the Hermes agent against this repo using the FREE keyless
# opencode-free provider (no API keys / secrets required).
#
# First run happens automatically when this branch is pushed (smoke test).
# After that: Actions tab -> Overnight Agent -> Run workflow -> type a task.
#
# NOTE: the nightly schedule below only takes effect once this branch is
# merged into main (GitHub restriction: schedules fire from the default
# branch only). Until then, use manual dispatch.
on:
  push:
    branches: [ci/overnight-agent]
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the overnight agent"
        required: false
        default: "Inspect this repository. Run the available test suites (node 02-pricing-tests.cjs, node 04-activity-feed.test.cjs if present). Report architecture, test health, and three safe next coding tasks. Do NOT modify any files."
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST daily

concurrency:
  group: overnight-agent
  cancel-in-progress: true

env:
  REPORT_DIR: reports

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install from source: the PyPI release predates the keyless
      # opencode-free provider.
      - name: Install Hermes Agent (from source)
        run: pip install --no-input "git+https://github.com/NousResearch/hermes-agent.git"

      - name: Configure Hermes (keyless free provider)
        run: |
          mkdir -p ~/.hermes
          cat > ~/.hermes/config.yaml <<'EOF'
          model:
            provider: opencode-free
            default: x-preview-f-free
          onboarding:
            seen:
              tool_progress_prompt: true
              busy_input_prompt: true
          EOF
          hermes --version || true

      - name: Prepare task
        env:
          TASK: ${{ inputs.task }}
          TASK_FILE: ${{ runner.temp }}/task.txt
        run: |
          if [ -n "$TASK" ]; then
            printf '%s' "$TASK" > "$TASK_FILE"
          else
            printf '%s' "Nightly sweep: run all *.test.cjs suites with node. If anything fails, diagnose and fix it minimally, then re-run to green. Summarize what changed." > "$TASK_FILE"
          fi
          echo "--- Task ---"; cat "$TASK_FILE"

      - name: Run overnight agent
        env:
          TASK_FILE: ${{ runner.temp }}/task.txt
          OUT_FILE: ${{ runner.temp }}/agent-output.md
        run: |
          set -o pipefail
          hermes chat -Q --yolo --no-restore-cwd \
            --provider opencode-free -m x-preview-f-free \
            -t terminal,file \
            --max-turns 60 \
            --query "$(cat "$TASK_FILE")" 2>&1 | tee "$OUT_FILE"
          {
            echo ""
            echo "## Files changed by agent"
            git status --short
          } >> "$OUT_FILE"
          mkdir -p "$REPORT_DIR"
          cp "$OUT_FILE" "$REPORT_DIR/run-$(date +%Y%m%d-%H%M%S).md"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: overnight-report
          path: reports/

      # Commits ONLY the dated report file — anything else left in the
      # tree stays uncommitted (visible in the report's git status).
      - name: Commit report
        run: |
          git config user.name "overnight-agent"
          git config user.email "adityachoudhary1476@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No report to commit."
          else
            git commit -m "overnight agent: run report [skip ci]"
            git pull --rebase -q origin ci/overnight-agent || git pull --rebase -q
            git push
          fi

      # Fires only once you add TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID as
      # repo secrets. Harmless no-op until then.
      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping."
            exit 0
          fi
          OUT=$(ls -t "$REPORT_DIR"/run-*.md | head -1)
          {
            echo "🌙 Overnight agent finished on cleanbid"
            echo ""
            tail -c 3500 "$OUT"
          } > "${{ runner.temp }}/tg_msg.txt"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text@${{ runner.temp }}/tg_msg.txt" > /dev/null && echo "Telegram notified."
