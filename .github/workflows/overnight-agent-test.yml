name: OpenCode Free Agent Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for OpenCode"
        required: true
        default: "Inspect this repository and report the architecture, available build/test commands, and three safe next coding tasks. Do not modify any files."
        type: string

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/free
          prompt: ${{ inputs.prompt }}
          use_github_token: true
